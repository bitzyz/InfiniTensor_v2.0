[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pyinfinitensor"
version = "0.1.0"
description = "Python frontend of InfiniTensor"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "numpy",
    "torch",
]
frontends = [
    "onnx",
    "onnxscript",
    "onnx2torch",
    "tensorflow-cpu",
    "tf2onnx",
    "paddlepaddle",
    "paddle2onnx",
]
all = [
    "pytest",
    "numpy",
    "torch",
    "onnx",
    "onnxscript",
    "onnx2torch",
    "tensorflow-cpu",
    "tf2onnx",
    "paddlepaddle",
    "paddle2onnx",
]

[tool.setuptools.package-data]
pyinfinitensor = ["*.so"]
